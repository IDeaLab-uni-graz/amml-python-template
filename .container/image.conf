# Configuration for .container/image.sh and .container/hpc-pull.sh (sourced by both, keep it POSIX sh).
# Per-machine overrides go to .container/image.local.conf (git-ignored).

# DockerHub image name; images are pushed to <IMAGE_NAME>-<hardware>[-slim] (rename for new projects!)
# Credentials: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in .env
IMAGE_NAME="devidealab/amml-python-template"
# Hardware variants to build, passed as `--build-arg hardware=<hardware>`
# (full/slim is not configured here: the Dockerfile's default `ARG version` is used)
HARDWARE="cpu cuda"
# Files defining the image content - only changes to these trigger a rebuild
DEPS_FILES="Dockerfile requirements.txt entrypoint.sh"
# Extra `docker build` arguments
BUILD_ARGS=""
# Kill the build if it runs longer than this (systemd launcher only)
MAX_RUNTIME="4h"
