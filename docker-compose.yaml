name: "amml_python_template"
services:
  # Note: If desired, add "version: slim" to the build args
  # Warn: We cannot set the Docker container to work in the
  # `host` mode, as it interferes with PyCharm handling of
  # how Jupyter is run. However, we can make an alias for
  # the host network accessible to the Docker container.
  amml-project-cpu:
    build:
      context: .
      args:
        hardware: cpu
    env_file: ".env"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Docker defaults to 64 MB, which is too small for DataLoader workers and Ray
    shm_size: "16gb"
    command: bash
    volumes:
      - .:/opt/project
    image: devidealab/amml-python-template-cpu:local
  amml-project-hydra-cpu:
    build:
      context: .
      args:
        hardware: cpu
    env_file: ".env"
    extra_hosts:
      - "host.docker.internal:10.18.74.13"
    # Docker defaults to 64 MB, which is too small for DataLoader workers and Ray
    shm_size: "16gb"
    command: bash
    volumes:
      - .:/opt/project
    image: devidealab/amml-python-template-cpu:local
  amml-project-cuda:
    build:
      context: .
      args:
        hardware: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    env_file: ".env"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Docker defaults to 64 MB, which is too small for DataLoader workers and Ray
    shm_size: "16gb"
    command: bash
    volumes:
      - .:/opt/project
    image: devidealab/amml-python-template-cuda:local
  amml-project-hydra-cuda:
    build:
      context: .
      args:
        hardware: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['4', '5', '6', '7']
              capabilities:
                - gpu
    env_file: ".env"
    extra_hosts:
      - "host.docker.internal:10.18.74.13"
    # Docker defaults to 64 MB, which is too small for DataLoader workers and Ray
    shm_size: "16gb"
    command: bash
    volumes:
      - .:/opt/project
    image: devidealab/amml-python-template-cuda:local
